<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="10NP7gMEjipwhYXop76Py9_Z0NxW_KafJsZDx0DaYPo" />
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Display Image</title>

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="./images/image-qr-code.png" id="placeholder-image" class="display-image"">
      <h1 id = "title"> Upload your own image!</h1>
      <p id = "description"> Click upload to upload an image</p>
    </div>
    <div class="upload">
      <img src="images/upload-icon.png" alt="Upload" id="upload-icon">
      <input type="file" id="image-input" accept="image/*">
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
